<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="jsmTitle jsmDesc">
  <title id="jsmTitle">JSM Home Watch &amp; Property Care Services</title>
  <desc id="jsmDesc">Pine trees, a lake house, and the JSM wordmark</desc>
  <defs>
    <linearGradient id="jsmFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B4A"/>
      <stop offset="55%" stop-color="#1A6B38"/>
      <stop offset="100%" stop-color="#0F3822"/>
    </linearGradient>
    <linearGradient id="treeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F9E4A"/>
      <stop offset="100%" stop-color="#0F5A28"/>
    </linearGradient>
    <linearGradient id="treeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3CB85A"/>
      <stop offset="100%" stop-color="#157A32"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E7AD4"/>
      <stop offset="100%" stop-color="#00529B"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F3822" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left pine -->
  <rect x="96" y="206" width="14" height="36" rx="2" fill="#4A2E12"/>
  <polygon points="103,38 58,118 148,118" fill="url(#treeDark)"/>
  <polygon points="103,78 50,162 156,162" fill="url(#treeDark)"/>
  <polygon points="103,122 46,214 160,214" fill="url(#treeDark)"/>

  <!-- Right pine -->
  <rect x="148" y="214" width="13" height="30" rx="2" fill="#4A2E12"/>
  <polygon points="154,58 116,128 196,128" fill="url(#treeLight)"/>
  <polygon points="154,96 108,170 204,170" fill="url(#treeLight)"/>
  <polygon points="154,138 104,218 208,218" fill="url(#treeLight)"/>

  <!-- House roof -->
  <path d="M232 148 L348 42 L548 168" fill="none" stroke="url(#roof)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M250 148 L348 58 L528 164" fill="none" stroke="#7EB6E8" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <!-- Chimney -->
  <rect x="500" y="58" width="22" height="58" rx="2" fill="#EAAA00"/>
  <rect x="496" y="50" width="30" height="10" rx="2" fill="#F5C63A"/>
  <!-- Window -->
  <rect x="328" y="86" width="36" height="40" rx="3" fill="#00529B"/>
  <path d="M346 86 V126 M328 106 H364" stroke="#EAAA00" stroke-width="3"/>

  <!-- JSM wordmark -->
  <text x="368" y="214" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="118" font-weight="700" fill="url(#jsmFill)" stroke="#EAAA00" stroke-width="4" paint-order="stroke fill" filter="url(#soft)">JSM</text>

  <!-- Waves -->
  <path d="M48 242 C 160 214, 300 228, 430 236 C 510 242, 560 230, 602 218" fill="none" stroke="#0F3822" stroke-width="16" stroke-linecap="round"/>
  <path d="M70 262 C 180 236, 310 248, 440 254 C 520 258, 568 248, 598 238" fill="none" stroke="#00529B" stroke-width="10" stroke-linecap="round"/>

  <text x="320" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3.2" fill="#00529B">HOME WATCH &amp; PROPERTY CARE SERVICES</text>
</svg>
